[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "disdat"
description = "Disdat: data versioning"
readme = "README.rst"
license = { text = "Apache License, version 2.0" }
authors = [{ name = "Ken Yocum", email = "kyocum@gmail.com" }]
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
# Runtime dependencies. Pins are migrated verbatim from setup.py here;
# modernization for Python 3.10-3.14 wheels happens in py314 Phase 2.
dependencies = [
    "boto3>=1.14.49,<2.0",
    "termcolor>=1.1.0,<2.0",
    "pandas>=1.5,<3.0",
    "numpy>=1.18.1,<=1.26.4",
    "sqlalchemy>=1.3.13,<1.4",
    "protobuf>=3.11.2,<4.0",
    "docutils<0.16,>=0.10",
]

[project.urls]
Homepage = "https://github.com/kyocum/disdat"

[project.scripts]
dsdt = "disdat.entrypoints.cli_ep:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ipython",
    "pylint",
    "coverage",
    "tox",
    "moto",
    "s3fs<=0.4.2",   # 0.5.0 breaks with aiobotocore and missing AWS headers
    "pyarrow",
    "grpcio-tools",  # vendors protoc (python -m grpc_tools.protoc) for hyperframe_pb2 regen
]
rel = [
    "build",
    "wheel",
]

[tool.setuptools_scm]
version_file = "disdat/version.py"

[tool.setuptools]
# Only ship files declared in package-data below; do not sweep the working
# tree (which previously leaked htmlcov/, docs/, infrastructure/ into wheels).
include-package-data = false

[tool.setuptools.packages.find]
include = ["disdat*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
"disdat" = ["config/disdat/*"]
