# Builds and publishes the disdat package to PyPI when a GitHub release is
# created (or via manual dispatch). Build is done with `uv build`; upload with
# twine using repository secrets.

name: Upload Python Package

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Manual publish event'
        required: true
        default: 'default default string'

  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # setuptools_scm derives the version from tags

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        # setup-uv maps this to UV_PYTHON, so it must be a concrete interpreter
        # request, not setup-python's '3.x' alias. The wheel is py3-none-any, so
        # any supported version builds it.
        python-version: '3.13'

    - name: Build sdist and wheel
      run: uv build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: uvx twine upload dist/*
